[package]
name = "aixker-rlt"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
color-eyre = "0.6.5"
crossterm = "0.29.0"
log = "0.4.28"
ndarray = { version = "0.16.1", features = ["serde"] }
ndarray-rand = "0.15.0"
rand = "0.8.0"
ratatui = { version = "0.29.0", features = ["termion"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt", "rt-multi-thread", "time"] }
aion-math = { git = "https://github.com/ali-heidari/aion-math" }
wgpu = "28.0.0"
pollster = "0.4.0"
